<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторна робота №5 — CSS, блочна модель, Developer Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main>
    <header id="logos_container" role="link" aria-label="Featured University Units">
      <div class="container">
        <div class="region region-logos">
          <section id="block-selectedunits" class="block block-block-content clearfix">
            <div class="field field--name-body field--type-text-with-summary field--label-hidden field--item">
              <div class="row">
                <div class="col-xs-4">
                  <a href="http://tsus.lpnu.ua/">
                    <img alt="Логотип Tech Startup School" class="img-responsive"
                         src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_tech-startup-school.png">
                  </a>
                </div>

                <div class="col-xs-4">
                  <a href="https://techbs.lpnu.ua/">
                    <img alt="Логотип Tech Business School" class="img-responsive"
                         src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_tech-business-school.png">
                  </a>
                </div>

                <div class="col-xs-4">
                  <a href="http://tsus.lpnu.ua/sid">
                    <img alt="Логотип наукового парку SID City" class="img-responsive"
                         src="https://lpnu.ua/themes/lpnu/images/LPNU_logo_SID-city-scientific-park.png">
                  </a>
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </header>
  </main>
</body>
</html>
