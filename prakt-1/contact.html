<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Контакти - Global Adventures Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Зв'яжіться з нами</h1>
        <p>Маєте питання чи пропозиції? Напишіть нам!</p>
    </header>
    
    <nav>

    </nav>

    <main>
        <section>
            <h2>Контактна форма</h2>
            <form method="post" action="#"> 
                <label for="name">Ваше ім'я:</label> 
                <input type="text" id="name" name="name" required>

                <label for="email">Електронна пошта:</label>
                <input type="email" id="email" name="email" required> 

                <label for="subject">Тема повідомлення:</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Повідомлення:</label>
                <textarea id="message" name="message" rows="5" required></textarea> 

                <button type="submit">Надіслати</button> 
            </form>
        </section>

        <section>
            <h2>Підписка на новини</h2> 
            <form method="post" action="#"> 
                <label for="sub-email">Ваш Email:</label> 
                <input type="email" id="sub-email" name="sub-email" placeholder="example@mail.com" required> 
                
                <label>
                    <input type="checkbox" name="agreement" required> 
                    Я погоджуюсь на отримання розсилки
                </label>
                <br><br>
                <button type="submit">Підписатися</button> 
            </form>
        </section>
    </main>

</body>
</html>
